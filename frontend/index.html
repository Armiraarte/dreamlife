<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DREAMLIFE — Drop GOD'S PLAN: playera oversized de algodón 305 g. Hecho en México." />
    <meta name="theme-color" content="#000000" />
    <title>DREAMLIFE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              primary: '#000000',
              secondary: '#1a1a1a',
              accent: '#ffffff',
              // Alias usados por los componentes nuevos (misma paleta blanco y negro).
              ink: '#000000',
              surface: '#18181b',
              line: 'rgba(255,255,255,0.1)',
              bone: '#ffffff',
              muted: '#9ca3af',
              gold: '#ffffff',
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out both',
              'slide-up': 'slideUp 1s ease-out both',
              'marquee': 'marquee 25s linear infinite',
              'shake': 'shake 0.5s ease-in-out',
              // Animaciones agregadas
              'scale-in': 'scaleIn .35s cubic-bezier(0.16, 1, 0.3, 1) both',
              'line-up': 'lineUp 1s cubic-bezier(0.16, 1, 0.3, 1) both',
              'pop': 'pop .4s cubic-bezier(0.34, 1.56, 0.64, 1)',
              'shimmer': 'shimmer 1.6s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '25%': { transform: 'translateX(-5px)' },
                '75%': { transform: 'translateX(5px)' },
              },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(.96)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              lineUp: {
                '0%': { transform: 'translateY(110%)' },
                '100%': { transform: 'translateY(0)' },
              },
              pop: {
                '0%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.35)' },
                '100%': { transform: 'scale(1)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Noise Texture Class */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 1;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Foco visible solo con teclado */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }

      /* Aparicion al hacer scroll (components/ui/Reveal.tsx) */
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity .9s cubic-bezier(0.16, 1, 0.3, 1), transform .9s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--reveal-delay, 0ms);
      }
      .reveal.is-visible { opacity: 1; transform: none; }

      /* Titular giratorio tipo cubo, una palabra por cubo (components/Hero.tsx).
         Cada palabra gira dentro de su propia franja (overflow hidden) para no
         encimarse con la otra. --cube-h = tamano de letra x 0.95. */
      .text-cube { --cube-h: 5.7rem; perspective: 1400px; height: var(--cube-h); overflow: hidden; }
      @media (min-width: 768px) { .text-cube { --cube-h: 10.45rem; } }
      @media (min-width: 1024px) { .text-cube { --cube-h: 12.35rem; } }
      .text-cube__inner {
        position: relative;
        height: 100%;
        transform-style: preserve-3d;
        animation: cubeSpin 12s cubic-bezier(0.77, 0, 0.18, 1) infinite;
      }
      .text-cube__face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      /* Cada cara solo es visible mientras le toca (y durante su giro de entrada/salida);
         asi no se asoman de canto las caras de arriba/abajo por la perspectiva. */
      .text-cube__face { animation-duration: 12s; animation-timing-function: linear; animation-iteration-count: infinite; }
      .text-cube__face:nth-child(1) { transform: rotateX(0deg) translateZ(calc(var(--cube-h) / 2)); animation-name: cubeFace1; }
      .text-cube__face:nth-child(2) { transform: rotateX(-90deg) translateZ(calc(var(--cube-h) / 2)); animation-name: cubeFace2; }
      .text-cube__face:nth-child(3) { transform: rotateX(-180deg) translateZ(calc(var(--cube-h) / 2)); animation-name: cubeFace3; }
      .text-cube__face:nth-child(4) { transform: rotateX(-270deg) translateZ(calc(var(--cube-h) / 2)); animation-name: cubeFace4; }
      @keyframes cubeFace1 { 0%, 25% { opacity: 1; } 25.01%, 94.99% { opacity: 0; } 95%, 100% { opacity: 1; } }
      @keyframes cubeFace2 { 0%, 19.99% { opacity: 0; } 20%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
      @keyframes cubeFace3 { 0%, 44.99% { opacity: 0; } 45%, 75% { opacity: 1; } 75.01%, 100% { opacity: 0; } }
      @keyframes cubeFace4 { 0%, 69.99% { opacity: 0; } 70%, 99.9% { opacity: 1; } 100% { opacity: 0; } }

      /* Texto con degradado: la caja se agranda para que el degradado cubra las letras
         completas (con interlineado 0.8 las letras sobresalen y se veian cortadas). */
      .text-cube__word { display: inline-block; line-height: 1.15; padding: 0 0.06em; }
      @keyframes cubeSpin {
        0%, 20%   { transform: translateZ(calc(var(--cube-h) / -2)) rotateX(0deg); }
        25%, 45%  { transform: translateZ(calc(var(--cube-h) / -2)) rotateX(90deg); }
        50%, 70%  { transform: translateZ(calc(var(--cube-h) / -2)) rotateX(180deg); }
        75%, 95%  { transform: translateZ(calc(var(--cube-h) / -2)) rotateX(270deg); }
        100%      { transform: translateZ(calc(var(--cube-h) / -2)) rotateX(360deg); }
      }

      /* Video del hero en "flashazos": aparece en destellos irregulares y se apaga. */
      .hero-flash-video { opacity: 0; animation: heroFlash 9s ease-out infinite; }
      .hero-flash-white { opacity: 0; animation: heroFlashWhite 9s ease-out infinite; }
      @keyframes heroFlash {
        0%   { opacity: 0; }
        3%   { opacity: .6; }
        12%  { opacity: .35; }
        18%  { opacity: 0; }
        33%  { opacity: 0; }
        34%  { opacity: .65; }
        38%  { opacity: .2; }
        39%  { opacity: .55; }
        50%  { opacity: 0; }
        66%  { opacity: 0; }
        67%  { opacity: .7; }
        78%  { opacity: .3; }
        88%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes heroFlashWhite {
        0%   { opacity: 0; }
        2%   { opacity: .35; }
        6%   { opacity: 0; }
        33%  { opacity: 0; }
        34%  { opacity: .4; }
        36%  { opacity: 0; }
        38%  { opacity: 0; }
        39%  { opacity: .2; }
        41%  { opacity: 0; }
        66%  { opacity: 0; }
        67%  { opacity: .45; }
        70%  { opacity: 0; }
        100% { opacity: 0; }
      }

      /* Esqueleto de carga */
      .skeleton {
        background: linear-gradient(90deg, #18181b 25%, #27272a 37%, #18181b 63%);
        background-size: 400% 100%;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
          scroll-behavior: auto !important;
        }
        .reveal { opacity: 1; transform: none; }
      }
    </style>
</head>
  <body class="bg-black text-white font-sans antialiased selection:bg-white selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

# Entorno de desarrollo de Dreamlife.
#
#   cp .env.example .env            (y llena las claves)
#   docker compose up -d --build
#
#   Frontend:   http://localhost:3000
#   API:        http://localhost:8000/api/products
#   Correos:    http://localhost:8025  (Mailpit, atrapa todo lo que se envia)
#   MySQL:      localhost:3307

name: dreamlife

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dream_life}
      MYSQL_USER: ${DB_USERNAME:-dream}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        COMPOSER_FLAGS: ""
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dream_life}
      DB_USERNAME: ${DB_USERNAME:-dream}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-dreamlifemx}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_SCHEME: "null"
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@dreamlife.mx}
      MAIL_TO_ADMIN: ${MAIL_TO_ADMIN:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    volumes:
      # Codigo montado para editar en vivo; vendor queda en un volumen propio.
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      # Vite reenvia /api al backend; el navegador habla con un solo origen.
      VITE_PROXY_TARGET: http://nginx:80
      VITE_API_BASE: ""
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # node_modules de Linux, separados de los de Windows.
      - frontend_node_modules:/app/node_modules

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
